<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡質感．五數隨機排序器</title>
    <style>
        :root {
            --primary: #4e73df;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --box-shadow: 0 10px 30px rgba(118, 75, 162, 0.2);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--box-shadow);
            width: 90%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            color: #3a3b45;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p {
            color: #858796;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .number-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 35px;
            min-height: 70px;
        }
        .number-box {
            flex: 1;
            background: var(--gradient);
            color: white;
            font-size: 24px;
            font-weight: bold;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: scale(0);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        button {
            background: #1cc88a;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(28, 200, 138, 0.3);
            transition: all 0.2s ease;
            width: 100%;
        }
        button:hover {
            background: #17a673;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(28, 200, 138, 0.4);
        }
        button:active {
            transform: translateY(1px);
        }
        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎲 5 數字隨機排序</h2>
    <p>隨機將 1 ~ 5 的數字重新洗牌</p>
    
    <div class="number-container" id="boxContainer">
        <div style="color: #ccc; width: 100%; line-height: 65px;">點擊下方按鈕開始</div>
    </div>

    <button onclick="generateRandomNumbers()">一次產生 5 個數字</button>
</div>

<script>
function generateRandomNumbers() {
    // 建立 1 到 5 的陣列
    let numbers = [1, 2, 3, 4, 5];
    
    // Fisher-Yates 洗牌演算法（完美的隨機排序）
    for (let i = numbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
    }

    const container = document.getElementById('boxContainer');
    container.innerHTML = ''; // 清空舊的內容

    // 動態渲染 5 個精美的方塊，並加上微小的延遲動畫讓視覺更有節奏感
    numbers.forEach((num, index) => {
        const box = document.createElement('div');
        box.className = 'number-box';
        box.innerText = num;
        box.style.animationDelay = `${index * 0.08}s`; 
        container.appendChild(box);
    });
}
</script>

</body>
</html>
